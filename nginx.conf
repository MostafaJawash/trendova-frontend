server { listen 80; location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; } location /api/ { proxy_pass ${BACKEND_URL:-http://host.docker.internal:8000}; } location /media/ { proxy_pass ${BACKEND_URL:-http://host.docker.internal:8000}; } location /health { proxy_pass ${BACKEND_URL:-http://host.docker.internal:8000}; } }
