server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
  }

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /media/ {
    proxy_pass ${BACKEND_URL};
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass ${BACKEND_URL};
    proxy_set_header Host $host;
  }
}
